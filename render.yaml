# Deploy as Render Blueprint -> New -> Blueprint -> select this GitHub repository.
# Dashboard service is the existing MARKET PULSE Python server, NOT a new UI.
services:
  - type: web
    name: market-pulse-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app_server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MARKET_PULSE_CLOUD
        value: "1"
      - key: MARKET_PULSE_AUTO_OPEN
        value: "0"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_DAILY_REQUEST_CAP
        value: "24"
      - key: MARKET_PULSE_SITE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
